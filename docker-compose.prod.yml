services:

  # ==========================================
  # BACKEND (From GitHub Container Registry)
  # ==========================================
  backend:
    image: ghcr.io/leduycoder/kujilingo_be:${IMAGE_TAG:-latest}
    container_name: kujilingo-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override both URLs from .env so Prisma always uses the same credentials
      # as the PostgreSQL container, including for `prisma migrate deploy`.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-kujilingo}?schema=public"
      DIRECT_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-kujilingo}?schema=public"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kujilingo-network

  # ==========================================
  # POSTGRESQL
  # ==========================================
  postgres:
    image: postgres:17
    container_name: kujilingo-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kujilingo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kujilingo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kujilingo-network

# ==========================================
# VOLUMES
# ==========================================
volumes:
  postgres_data:

# ==========================================
# NETWORK
# ==========================================
networks:
  kujilingo-network:
    driver: bridge
