services:

  # ==========================================
  # BACKEND (From GitHub Container Registry)
  # ==========================================
  backend:
    image: ghcr.io/leduycoder/kujilingo_be:${IMAGE_TAG:-latest}
    container_name: kujilingo-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:123456@postgres:5432/kujilingo
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kujilingo-network

  # ==========================================
  # POSTGRESQL
  # ==========================================
  postgres:
    image: postgres:17
    container_name: kujilingo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: kujilingo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kujilingo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kujilingo-network

# ==========================================
# VOLUMES
# ==========================================
volumes:
  postgres_data:

# ==========================================
# NETWORK
# ==========================================
networks:
  kujilingo-network:
    driver: bridge
