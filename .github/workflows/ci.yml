name: CI

on:
  push:
    branches:
      - main
      - dev
      - ci/github-actions

  pull_request:
    branches:
      - main
      - dev

jobs:

  # =======================================================
  # JOB 1: TYPE CHECK
  # =======================================================
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Type check
        run: npm run typecheck


  # =======================================================
  # JOB 2: TEST
  # =======================================================
  test:
    name: Test
    runs-on: ubuntu-latest

    needs:
      - typecheck

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123456
          POSTGRES_DB: kujilingo

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d kujilingo"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:123456@localhost:5432/kujilingo?schema=public

      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}

      MAIL_FROM_EMAIL: ${{ secrets.MAIL_FROM_EMAIL }}
      MAIL_FROM_NAME: KujiLingo

      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}

      ALLOW_LOGIN_BEFORE_VERIFICATION: "false"

      JISHO_API_URL: https://jisho.org/api/v1/search/words

      PAYOS_CLIENT_ID: ${{ secrets.PAYOS_CLIENT_ID }}
      PAYOS_CLIENT_SECRET: ${{ secrets.PAYOS_CLIENT_SECRET }}
      PAYOS_CHECKSUM_KEY: ${{ secrets.PAYOS_CHECKSUM_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate RSA Keys for Testing
        run: |
          openssl genrsa -out private.pem 2048
          openssl rsa -in private.pem -outform PEM -pubout -out public.pem

          echo "JWT_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          cat private.pem >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          echo "JWT_PUBLIC_KEY<<EOF" >> $GITHUB_ENV
          cat public.pem >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run Prisma migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test


  # =======================================================
  # JOB 3: BUILD
  # =======================================================
  build:
    name: Build
    runs-on: ubuntu-latest

    needs:
      - typecheck
      - test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Build
        run: npm run build