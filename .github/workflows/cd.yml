name: Backend CD - Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch cần deploy lên server'
        required: false
        default: 'main'

jobs:
  deploy:
    name: Deploy Backend to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "========================================================"
            echo "🚀 Bắt đầu quá trình Deploy Backend trên Server..."
            echo "========================================================"

            APP_DIR="${{ secrets.SERVER_APP_DIR || '/var/www/kujilingo-be' }}"
            TARGET_BRANCH="${{ github.event.inputs.branch || 'main' }}"

            echo "📂 Thư mục dự án: $APP_DIR"
            if [ ! -d "$APP_DIR" ]; then
              echo "❌ Thư mục $APP_DIR không tồn tại trên server!"
              exit 1
            fi

            cd "$APP_DIR"

            echo "⚙️ Thiết lập Git safe directory..."
            git config --global --add safe.directory "$APP_DIR" || true

            echo "📥 Kéo mã nguồn mới nhất từ nhánh '$TARGET_BRANCH'..."
            git fetch origin "$TARGET_BRANCH"
            git checkout "$TARGET_BRANCH"
            git pull origin "$TARGET_BRANCH"

            echo "🐳 Xác định phiên bản Docker Compose..."
            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            else
              COMPOSE_CMD="docker-compose"
            fi

            echo "🔨 Build và tái khởi động container backend..."
            $COMPOSE_CMD up -d --build backend

            echo "⏳ Chờ backend container sẵn sàng..."
            sleep 5

            echo "🗄️ Thực hiện Prisma Database Migration..."
            $COMPOSE_CMD exec -T backend npx prisma migrate deploy

            echo "🧹 Dọn dẹp Docker images không sử dụng..."
            docker image prune -f

            echo "🔍 Kiểm tra trạng thái Backend (Healthcheck)..."
            if curl -s -f http://localhost:8000/health > /dev/null 2>&1; then
              echo "✅ Healthcheck OK: Backend đang hoạt động bình thường!"
            else
              echo "⚠️ Lưu ý: Healthcheck chưa phản hồi ngay hoặc đang dùng endpoint khác. Vui lòng kiểm tra: docker compose logs backend"
            fi

            echo "========================================================"
            echo "🎉 DEPLOY BACKEND HOÀN TẤT THÀNH CÔNG!"
            echo "========================================================"
