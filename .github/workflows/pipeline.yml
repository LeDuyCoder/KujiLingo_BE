name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
      - ci/github-actions
      - cd/github-actions

  pull_request:
    branches:
      - main
      - dev

jobs:
  # ==========================================
  # JOB 1: Type Check
  # ==========================================
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run Type Check
        run: npm run typecheck

  # ==========================================
  # JOB 2: Unit / Integration Tests
  # ==========================================
  test:
    name: Unit & Integration Tests
    needs: typecheck # Chạy sau khi Type Check xong
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123456
          POSTGRES_DB: kujilingo
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d kujilingo"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:123456@localhost:5432/kujilingo?schema=public
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      MAIL_FROM_EMAIL: ${{ secrets.MAIL_FROM_EMAIL }}
      MAIL_FROM_NAME: KujiLingo
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      ALLOW_LOGIN_BEFORE_VERIFICATION: "false"
      JISHO_API_URL: https://jisho.org/api/v1/search/words

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate RSA Keys for Testing
        run: |
          openssl genrsa -out private.pem 2048
          openssl rsa -in private.pem -outform PEM -pubout -out public.pem
          
          echo "JWT_PRIVATE_KEY<<EOF" >> $GITHUB_ENV
          cat private.pem >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          
          echo "JWT_PUBLIC_KEY<<EOF" >> $GITHUB_ENV
          cat public.pem >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run Prisma migrations
        run: npx prisma migrate deploy

      - name: Run Unit Tests
        run: npm test

  # ==========================================
  # JOB 3: Build Verification
  # ==========================================
  build:
    name: Build Project
    needs: test # Chạy sau khi Test thành công
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run Build
        run: npm run build

  # ==========================================
  # JOB 4: CD (Deploy to Server)
  # ==========================================
  deploy:
    name: Deploy to Debian Server
    needs: build # Đợi toàn bộ các bước CI (Type Check -> Test -> Build) hoàn tất
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cd/github-actions')
    runs-on: ubuntu-latest

    steps:
      - name: Deploying to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/KujiLingo_BE
            git checkout cd/github-actions
            git pull origin cd/github-actions
            docker compose build --no-cache backend
            docker compose up -d
            docker image prune -f